<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estadísticas de adopción</title>
  <meta name="description" content="Estadísticas y gráficos sobre los avisos de adopción de mascotas.">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <script src="https://code.highcharts.com/highcharts.js"></script>
</head>

<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">Estadísticas de Adopción</h1>
      <nav class="site-nav" aria-label="Navegación principal">
        <a href="{{ url_for('index') }}">Portada</a>
        <a href="{{ url_for('agregar_adopcion') }}">Agregar aviso</a>
        <a href="{{ url_for('listado') }}">Ver listado</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section>
      <h2>Estadísticas del Sistema de Adopción</h2>
    </section>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Avisos por día</h3>
        <div id="grafico-lineas" class="stat-chart"></div>
      </div>

      <div class="stat-card">
        <h3>Avisos por tipo (perro/gato)</h3>
        <div id="grafico-torta" class="stat-chart"></div>
      </div>

      <div class="stat-card">
        <h3>Avisos por mes, diferenciando perros y gatos</h3>
        <div id="grafico-barras" class="stat-chart"></div>
      </div>
    </div>

    <div class="actions">
      <a href="{{ url_for('index') }}" class="btn-primary">Volver a la portada</a>
    </div>
  </main>

  <script>
    function generarGraficoLineas(data) {
      Highcharts.chart('grafico-lineas', {
        chart: {
          type: 'line'
        },
        title: {
          text: ''
        },
        xAxis: {
          categories: data.dias,
          title: {
            text: 'Fecha'
          }
        },
        yAxis: {
          title: {
            text: 'Cantidad de avisos'
          }
        },
        series: [{
          name: 'Avisos',
          data: data.cantidades,
          color: '#4CAF50'
        }],
        credits: {
          enabled: false
        }
      });
    }

    function generarGraficoTorta(data) {
      Highcharts.chart('grafico-torta', {
        chart: {
          type: 'pie'
        },
        title: {
          text: ''
        },
        series: [{
          name: 'Cantidad',
          data: [
            {
              name: 'Perros',
              y: data.perros,
              color: '#FF9800'
            },
            {
              name: 'Gatos',
              y: data.gatos,
              color: '#2196F3'
            }
          ]
        }],
        credits: {
          enabled: false
        }
      });
    }

    function generarGraficoBarras(data) {
      Highcharts.chart('grafico-barras', {
        chart: {
          type: 'column'
        },
        title: {
          text: ''
        },
        xAxis: {
          categories: data.meses,
          title: {
            text: 'Mes'
          }
        },
        yAxis: {
          title: {
            text: 'Cantidad de avisos'
          }
        },
        series: [{
          name: 'Perros',
          data: data.perros,
          color: '#FF9800'
        }, {
          name: 'Gatos',
          data: data.gatos,
          color: '#2196F3'
        }],
        credits: {
          enabled: false
        }
      });
    }

    fetch('/api/estadisticas/avisos-por-dia')
      .then(response => response.json())
      .then(data => generarGraficoLineas(data))
      .catch(error => {
        console.error('Error al cargar gráfico de líneas:', error);
        document.getElementById('grafico-lineas').innerHTML = '<p class="error">Error al cargar el gráfico</p>';
      });

    fetch('/api/estadisticas/avisos-por-tipo')
      .then(response => response.json())
      .then(data => generarGraficoTorta(data))
      .catch(error => {
        console.error('Error al cargar gráfico de torta:', error);
        document.getElementById('grafico-torta').innerHTML = '<p class="error">Error al cargar el gráfico</p>';
      });

    fetch('/api/estadisticas/avisos-por-mes')
      .then(response => response.json())
      .then(data => generarGraficoBarras(data))
      .catch(error => {
        console.error('Error al cargar gráfico de barras:', error);
        document.getElementById('grafico-barras').innerHTML = '<p class="error">Error al cargar el gráfico</p>';
      });
  </script>

</body>
</html>
